name: planninghub

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: planninghub
      POSTGRES_PASSWORD: planninghub
      POSTGRES_DB: planninghub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planninghub -d planninghub"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./src/server
    image: planninghub/planninghub-server:local
    environment:
      ADO_ALLOWED_HOSTS: dev.azure.com,*.visualstudio.com,tfs-projects.cmf.criticalmanufacturing.com
      ADO_DESCRIPTION_MAX_CHARS: "2000"
      MCP_ALLOWED_HOSTS: localhost,localhost:*,127.0.0.1,127.0.0.1:*,172.17.0.1,172.17.0.1:*,server,server:*
      PUBLIC_BASE_URL: http://localhost:8080
      DB_HOST: postgres
      DB_USER: planninghub
      DB_PASSWORD: planninghub
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  client:
    build: ./src/client
    image: planninghub/planninghub-client:local
    environment:
      API_UPSTREAM: http://server:8000
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
